syntax = "proto3";

package buf.protoschema.test.v1;

// External message referenced from cross-file Any constraints
message ExternalMessageD {
  string field_d = 1;
  int64 timestamp = 2;
}

// Another external message for testing
message ExternalMessageE {
  string field_e = 1;
  repeated string tags = 2;
}