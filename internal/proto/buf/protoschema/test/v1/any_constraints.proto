syntax = "proto3";

package buf.protoschema.test.v1;

import "buf/validate/validate.proto";
import "google/protobuf/any.proto";

// Test message for single Any field with constraints
message EventEnvelope {
  string id = 1;
  google.protobuf.Any payload = 2 [(buf.validate.field).any = {
    in: [
      "type.googleapis.com/buf.protoschema.test.v1.MessageA",
      "type.googleapis.com/buf.protoschema.test.v1.MessageB"
    ]
  }];
}

// Test message for repeated Any field with constraints
message EventBatch {
  repeated google.protobuf.Any events = 1 [(buf.validate.field).repeated.items.any = {
    in: [
      "type.googleapis.com/buf.protoschema.test.v1.MessageA",
      "type.googleapis.com/buf.protoschema.test.v1.MessageB",
      "buf.protoschema.test.v1.MessageC"
    ]
  }];
}

// Test message for Any without constraints (should use default behavior)
message GenericEnvelope {
  string id = 1;
  google.protobuf.Any data = 2;
}

// Test payload message types
message MessageA {
  string field_a = 1;
  int32 number = 2;
}

message MessageB {
  string field_b = 1;
  bool flag = 2;
}

message MessageC {
  string field_c = 1;
  double value = 2;
}