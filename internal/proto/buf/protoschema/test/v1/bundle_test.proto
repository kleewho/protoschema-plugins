syntax = "proto3";

package buf.protoschema.test.v1;

import "buf/validate/validate.proto";
import "google/protobuf/any.proto";

// Test message for bundle generation with Any constraints
message BundleEnvelope {
  string id = 1;
  google.protobuf.Any payload = 2 [(buf.validate.field).any = {
    in: [
      "type.googleapis.com/buf.protoschema.test.v1.PayloadA",
      "type.googleapis.com/buf.protoschema.test.v1.PayloadB"
    ]
  }];
}

// Test payload message types
message PayloadA {
  string message = 1;
  int32 code = 2;
}

message PayloadB {
  bool success = 1;
  string details = 2;
}