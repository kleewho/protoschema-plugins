syntax = "proto3";

package buf.protoschema.test.v1;

import "buf/validate/validate.proto";
import "google/protobuf/any.proto";
import "buf/protoschema/test/v1/external_messages.proto";

// Test message that references both local and external messages in Any constraints
message CrossFileEventEnvelope {
  string id = 1;
  google.protobuf.Any payload = 2 [(buf.validate.field).any = {
    in: [
      "type.googleapis.com/buf.protoschema.test.v1.LocalMessage",
      "type.googleapis.com/buf.protoschema.test.v1.ExternalMessageD",
      "type.googleapis.com/buf.protoschema.test.v1.ExternalMessageE"
    ]
  }];
}

// Local message in the same file
message LocalMessage {
  string local_field = 1;
  bool local_flag = 2;
}